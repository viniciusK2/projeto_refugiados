<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Refugiados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header></header>
    <main class="row">
        <div class="col-4 div-img">
            <img style="max-width: 100%; height: 100vh;" src="img/login.png" alt="">
        </div>
        <form class="form col-sm-12 col-md-8  d-flex flex-column align-items-center justify-content-center">
            <h1>Seja bem vindo a Reffuges</h1>
            <p class="mb-5 text-secondary">Prepare-se para ser acolhido e ter toda ajuda necessária🆘</p>
            <div class="row mb-3 w-50">
                <label for="inputEmail3" class="col-sm-2 col-form-label">Email</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" id="inputEmail3">
                </div>
            </div>
            <div class="row mb-1 w-50">
                <label for="inputPassword3" class="col-sm-2 col-form-label">Senha</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" id="inputPassword3">
                </div>
            </div>
            <div class="row mb-3 w-50">
                <a href="" class="col-sm-4 col-form-label">Esqueceu a senha?</a>
                
            </div>
        
            <button type="submit" class="btn btn-primary">Acessar</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

</body>

</html>
