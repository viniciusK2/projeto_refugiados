<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Refugiados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

  <div class="menu" style="color: aqua; height: 70px; background-color: #333;">
    menu
  </div>
  <main class="row w-100" style="height: 150px !important;">
    <div class="col-6">
      <img class="img-fluid" src="img/menina_refugiada.png" alt="Menina refugiada">
    </div>
    <form class="col-6 g-5 d-flex flex-column align-items-center">
      <h1 class="mb-5">Cadastre-se</h1>
      <div class="row g-4">
        <div class="col-6">
          <input type="text" class="form-control" placeholder="Digite seu nome" required>
        </div>
        <div class="col-6">
          <input type="text" class="form-control" placeholder="Digite um e-mail para contato" required>
        </div>
        <div class="col-6">
          <input type="text" class="form-control" placeholder="Digite um número para contato" required>
        </div>
        <div class="col-6">
          <input type="text" class="form-control" placeholder="Digite o seu pais de origem" required>
        </div>
        <div class="col-md-6">
          <input type="password" class="form-control" id="inputPassword4" placeholder="Escolha sua senha" required>
        </div>
        <div class="col-12">
          <input type="text" class="form-control" id="inputAddress2" placeholder="Endereço, localidade atual" required>
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control" id="cidade" placeholder="cidade" required>
        </div>
        <div class="col-md-4">
          <select id="inputState" class="form-select">
            <option selected>Estado</option>
            <option>...</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" id="inputZip" placeholder="CEP">
        </div>
        <div class="col-12 d-flex justify-content-center">
          <textarea class="form-control" name="text-area" id="text-area" placeholder="Digite sua situação atual"
          rows="7"></textarea>
        </div>
        <div class="col-12 d-flex justify-content-center w-100">
           <button type="submit" class="btn btn-outline-secondary w-50">Cadastrar</button>
        </div>

      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YjC4E712z1H4i9Jb4D8t5ZtH1pQ2v7q1hQ4t6z8S9jF2M5fR7d5c7b9g5c6g7h8k9aA"
    crossorigin="anonymous"></script>
</body>

</html>
